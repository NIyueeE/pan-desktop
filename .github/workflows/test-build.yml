name: Test build

# CD test builds: compile the binary for chosen platforms at an arbitrary
# commit WITHOUT creating a release. See AGENTS.md §6 and docs/release.md.
# Releases are tag-driven only (release.yml); this workflow never publishes.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit SHA, branch, or tag to build"
        required: false
        default: "main"
      targets:
        description: "Platforms, comma-separated (linux, macos, windows)"
        required: false
        default: "linux,macos,windows"

run-name: Test build ${{ inputs.ref }} [${{ inputs.targets }}]

permissions:
  contents: read

jobs:
  plan:
    name: plan matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Build matrix from requested platforms
        env:
          REQUESTED: ${{ inputs.targets }}
        run: |
          MATRIX=$(printf '%s' "$REQUESTED" | tr ', ' '\n\n' | sed '/^$/d' | jq -Rsc '
            def platform:
              {
                "linux":   {os: "ubuntu-latest",  target: "x86_64-unknown-linux-gnu"},
                "macos":   {os: "macos-latest",   target: "aarch64-apple-darwin"},
                "windows": {os: "windows-latest", target: "x86_64-pc-windows-msvc"}
              }[.];
            split("\n")
            | map(select(length > 0)
                | platform
                | if . == null then error("unknown platform; use linux, macos, windows") else . end)
            | unique
            | {include: .}
          ')
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  build:
    name: build ${{ matrix.target }}
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      # rust-toolchain.toml resolves the stable toolchain; the job adds the matrix target
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Upload test artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-build-${{ matrix.target }}-${{ github.sha }}
          path: |
            target/${{ matrix.target }}/release/rust-template
            target/${{ matrix.target }}/release/rust-template.exe
          if-no-files-found: error
          retention-days: 7
