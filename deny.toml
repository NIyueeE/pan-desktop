# cargo-deny policy — https://embarkstudios.github.io/cargo-deny/
# Wired into githooks/pre-push. The manifest lives in src-tauri; the hook
# runs cargo deny from that directory.

[graph]
# collect metadata with all features so no platform/feature dep tree is missed
all-features = true

[licenses]
version = 2
# permissive licenses accepted for dependencies; extend as needed
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    # permissive licenses present in pan's dependency graph
    # (clipboard-win / error-code ship BSL-1.0; libfuzzer-sys pulls NCSA;
    # webpki-root-certs ships CDLA-Permissive-2.0)
    "BSL-1.0",
    "NCSA",
    "CDLA-Permissive-2.0",
    # pan is GPL-3.0-only (inherited from pot-desktop), so GPL dependencies
    # such as `selection` are compatible by definition
    "GPL-3.0-only",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[advisories]
version = 2
yanked = "deny"
# Unmaintained-class advisories stay warnings (same severity cargo audit
# gives them). Everything currently flagged is transitive through
# tauri/tao/wry with no safe upgrade available — see HANDOFF.md.
unmaintained = "none"
# Temporary waivers — see HANDOFF.md "Open threads".
ignore = [
    # quick-xml 0.28.2 (DoS-class) is pinned by the linux screenshot stack
    # (screenshots -> libwayshot -> wayland-scanner); no 0.28.x patch release
    # exists. Remove when upstream moves.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
