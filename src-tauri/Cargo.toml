[package]
name = "pot"
version = "4.1.1"
description = "Pot App"
authors = ["pot-app"]
license = "GPL-3.0-only"
repository = "https://github.com/pot-app/pot-desktop"
edition = "2024"
rust-version = "1.97"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["protocol-asset", "devtools", "tray-icon"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-fs = "2.5.1"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-http = "2.5.9"
tauri-plugin-log = "2.9.0"
tauri-plugin-notification = "2.3.3"
tauri-plugin-os = "2.3.2"
tauri-plugin-shell = "2.3.5"
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-store = "2.4.4"
serde = { version = "1.0.229", features = ["derive"] }
selection = "1.2.0"
serde_json = "1.0.151"
dirs = "6.0.0"
once_cell = "1.21.4"
mouse_position = "0.1.4"
log = "0.4.33"
screenshots = "0.8.10"
base64 = "0.23.1"
arboard = "3.6.1"
lingua = { version = "1.8.0", default-features = false, features = ["chinese", "japanese", "english", "korean", "french", "spanish", "german", "russian", "italian", "portuguese", "turkish", "arabic", "vietnamese", "thai", "indonesian", "malay", "hindi", "mongolian", "persian", "nynorsk", "bokmal", "ukrainian"] }
thiserror = "2.0.20"
font-kit = "0.14.3"
image = "0.25.10"

[target.'cfg(target_os = "macos")'.dependencies]
macos-accessibility-client = "0.0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Graphics_Imaging", "Media_Ocr", "Foundation", "Globalization", "Storage", "Storage_Streams"] }

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[lints.rust]
unsafe_code = "allow"
missing_docs = "allow"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Tauri command signatures take handles by value by design.
needless_pass_by_value = "allow"
# Window geometry and WinRT bindings rely on well-understood numeric casts.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
# Localized tray label table and its fallback behavior are intentionally explicit.
too_many_lines = "allow"
match_same_arms = "allow"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "deny"
