[package]
name = "pan"
version = "0.1.0"
edition = "2024"
description = "A lean translation desktop app derived from rust-agents-template"
license = "MIT OR Apache-2.0"
repository = "https://github.com/NIyueeE/pan-desktop"

[dependencies]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "warn"
